[project]
name = "pci"
version = "0.1.0"
description = "Proximal causal inference: bridges, doubly-robust estimators, blind tuning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = [
    "causal-inference",
    "proximal",
    "doubly-robust",
    "negative-controls",
    "kernel-methods",
    "rkhs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pci*"]
exclude = ["simulations*", "tests*"]

[tool.pytest.ini_options]
# pytest.ini at the root takes precedence; this is a fallback.
testpaths = ["pci/tests", "simulations/tests"]
norecursedirs = [
    ".git",
    "__pycache__",
    "*.egg-info",
    "simulations/archive",
    "simulations/results",
]
