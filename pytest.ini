[pytest]
# C12 (May 2026): archive/ subtree contains 18 legacy test files that
# pre-date the canonical pci/tests/ suite. They still work but are not
# collected by default. Run them explicitly via:
#     python -m pytest simulations/archive/tests/test_<name>.py
norecursedirs =
    .git
    __pycache__
    *.egg-info
    simulations/archive
    simulations/results
    .claude
testpaths =
    pci/tests
    simulations/tests
